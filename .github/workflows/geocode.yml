name: Geokodiranje ordinacija

# Ručno pokretanje: Actions -> "Geokodiranje ordinacija" -> Run workflow.
# Radi nad granom `geokodiranje` i na nju commituje keš (data/geocode-cache.json) i js/imported-coords.js.
# Potreban je secret NOMINATIM_EMAIL (kontakt u User-Agent-u za Nominatim).
on:
  workflow_dispatch:

concurrency:
  group: geocode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NOMINATIM_EMAIL: ${{ secrets.NOMINATIM_EMAIL }}
      TARGET_BRANCH: geokodiranje
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testovi logike (lažni odgovori, bez mreže)
        run: python -m unittest discover -s tools -p "test_geocode_clinics.py" -v

      - name: Geokodiranje (po 300 adresa, commit posle svake serije)
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_push() {
            git add data/geocode-cache.json js/imported-coords.js
            if git diff --cached --quiet; then
              echo "Nema promena za commit."
              return 0
            fi
            git commit -m "Geokodiranje: keš i koordinate ($1)"
            for i in 1 2 3 4; do
              git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH" && return 0
              sleep $((i * 5))
            done
            return 1
          }

          while true; do
            set +e
            python tools/geocode_clinics.py --limit 300
            code=$?
            set -e
            commit_push "$(date -u +%H:%M UTC)"
            if [ "$code" -eq 10 ]; then
              continue      # ima još neobrađenih adresa
            fi
            exit "$code"    # 0 = gotovo, ostalo = greška
          done

      - name: Izveštaj
        if: always()
        run: python tools/geocode_clinics.py --report || true

      - name: Commit preostalog (ako je posao prekinut usred serije)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/geocode_clinics.py --build-only || true
          git add data/geocode-cache.json js/imported-coords.js
          if ! git diff --cached --quiet; then
            git commit -m "Geokodiranje: keš i koordinate (završni commit)"
            git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:$TARGET_BRANCH" || true
          fi
