name: Nove ordinacije (statične stranice)

# Svake noći (i ručno: Actions -> "Nove ordinacije (statične stranice)" -> Run workflow):
#   1) preuzima objavljene nove ordinacije iz Supabase-a (javni RPC, samo publishable ključ, bez upisa u bazu)
#      u data/new-clinics.json,
#   2) ponovo generiše statične stranice (tools/build_pages.py),
#   3) ako ima promena, commituje ih na main (Netlify onda sam objavljuje).
# Ako preuzimanje ne uspe, job pada i NIŠTA ne commituje (postojeće stranice ostaju kakve jesu).
# Ako bi promena dirala neočekivano mnogo fajlova, job staje bez commit-a (zaštita od greške u generisanju).
on:
  schedule:
    - cron: "17 2 * * *"      # 02:17 UTC svake noći
  workflow_dispatch:

concurrency:
  group: nove-ordinacije
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAX_CHANGED_FILES: "400"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testovi (bez mreže)
        run: python -m unittest discover -s tools -p "test_new_clinics.py" -v

      - name: Preuzimanje objavljenih ordinacija
        run: python tools/fetch_new_clinics.py

      - name: Generisanje stranica
        run: python tools/build_pages.py

      - name: Commit i push (samo ako ima promena)
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nema promena."
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l)
          echo "Promenjenih fajlova: $n"
          if [ "$n" -gt "$MAX_CHANGED_FILES" ]; then
            echo "::error::Previše promenjenih fajlova ($n > $MAX_CHANGED_FILES); commit je preskočen."
            git diff --cached --name-only | head -30
            exit 1
          fi
          git commit -m "Nove ordinacije: automatsko osvežavanje statičnih stranica ($n fajlova)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
