# Domen: produkcioni netlify.app host se trajno preusmerava na https://nadjizubara.rs (bez duplog sadržaja).
# Pravilo važi samo za tačno ovaj host. Deploy preview (deploy-preview-N--nadjizubara.netlify.app) i branch
# deploy (<grana>--nadjizubara.netlify.app) su drugi hostovi, pa se NE preusmeravaju.
[[redirects]]
  from = "https://nadjizubara.netlify.app/*"
  to = "https://nadjizubara.rs/:splat"
  status = 301
  force = true

# Stari (demo) nalog sa localStorage-om je uklonjen; stare adrese vode na početnu.
[[redirects]]
  from = "/nalog"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/nalog.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/prijava"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/prijava.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard.html"
  to = "/"
  status = 301
  force = true

# Podaci za geokodiranje (keš sa odgovorima Nominatima) su u repou, ali se ne objavljuju na sajtu.
# js/imported-coords.js ostaje javan (koristi ga pretraga). force = true jer fajlovi u data/ postoje.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

# Stranice za preuzimanje profila: stroga zaštita (CSP). Skripte samo sa našeg domena i jsDelivr-a
# (Supabase biblioteka sa SRI), veza samo ka našem Supabase projektu.
[[headers]]
  for = "/preuzmi.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/moj-nalog.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/izmena-profila.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://iyyythycaulhdjzhmqzo.supabase.co; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Administratorska stranica: skrivena (noindex), bez keširanja, ista CSP kao za stranice vlasnika.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://iyyythycaulhdjzhmqzo.supabase.co; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Keš (brzina): fontovi se nikad ne menjaju pod istim imenom (immutable, godinu dana); slike 7 dana; CSS/JS nemaju
# heš u imenu, pa kratko (1 h, uz osvežavanje u pozadini), da izmene stignu brzo. HTML ostaje na podrazumevanom
# Netlify ponašanju (uvek provera sveže verzije). Netlify sam uključuje gzip/brotli za html, css, js, json, svg.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
