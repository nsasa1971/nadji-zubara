# Podaci za geokodiranje (keš sa odgovorima Nominatima) su u repou, ali se ne objavljuju na sajtu.
# js/imported-coords.js ostaje javan (koristi ga pretraga). force = true jer fajlovi u data/ postoje.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

# Stranice za preuzimanje profila: stroga zaštita (CSP). Skripte samo sa našeg domena i jsDelivr-a
# (Supabase biblioteka sa SRI), veza samo ka našem Supabase projektu.
[[headers]]
  for = "/preuzmi.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/moj-nalog.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/izmena-profila.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://iyyythycaulhdjzhmqzo.supabase.co; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Administratorska stranica: skrivena (noindex), bez keširanja, ista CSP kao za stranice vlasnika.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://iyyythycaulhdjzhmqzo.supabase.co; connect-src 'self' https://iyyythycaulhdjzhmqzo.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
